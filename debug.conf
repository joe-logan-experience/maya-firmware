# Runtime instrumentation overlay — memory and CPU monitoring.
#
# Opt-in, so the production build stays lean:
#   west build -b esp32_devkitc/esp32/procpu -- -DEXTRA_CONF_FILE=debug.conf
#
# Gives you an interactive shell over the same UART as the console:
#   kernel thread list      per-thread state, stack usage, CPU %
#   kernel thread stacks    stack high-water marks
#   kernel cycles           total vs idle cycles (whole-system CPU load)
#   kernel heap             system heap free/allocated
#   kernel uptime

# --- Thread bookkeeping (prerequisites for everything below) ---
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y

# Paint stacks at boot so unused depth can be measured by high-water mark.
CONFIG_INIT_STACKS=y

# --- CPU utilisation ---
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y
CONFIG_SCHED_THREAD_USAGE_ANALYSIS=y

# --- Heap instrumentation ---
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# --- Interactive shell ---
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096

# --- Thread analyzer ---
# Available for on-demand calls to thread_analyzer_print() from your code.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_ANALYZER_ISR_STACK_USAGE=y

# Periodic auto-dump. Off by default because it interleaves with the shell
# prompt; flip AUTO on for headless runs where you cannot type (e.g. watching
# the turret under sustained BLE write load).
CONFIG_THREAD_ANALYZER_AUTO=n
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=10
CONFIG_THREAD_ANALYZER_AUTO_STACK_SIZE=2048
